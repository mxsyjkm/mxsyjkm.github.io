<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GJY 文件查看器</title>
    <!-- JSZip 用本地 -->
    <script src="jszip.min.js"></script>
    <!-- CryptoJS 直接用 CDN -->
    <script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- ========== 顶部横幅：AI提示 + 仓库链接 ========== -->
        <div class="top-banner">
            <div class="banner-warning">
                ⚠️ 本工具由 AI 生成，请注意甄别使用
            </div>
            <div class="banner-repo">
                🔗 原项目：<a href="https://github.com/mxsyjkm/gjy-file-edit/" target="_blank">
                    github.com/mxsyjkm/gjy-file-edit/
                </a>
            </div>
        </div>

        <!-- ========== 主标题 ========== -->
        <header>
            <h1>📄 GJY 文件查看器</h1>
            <p class="subtitle">支持 .gjy · .gjyx · .gjyy · .gjyxc</p>
        </header>

        <!-- ========== 存储位置 ========== -->
        <section class="folder-section">
            <label>📁 存储位置</label>
            <div class="folder-row">
                <input type="text" id="folderInput" placeholder="请选择包含 GJY 文件的文件夹" readonly>
                <button id="selectFolderBtn">选择文件夹</button>
            </div>
        </section>

        <!-- ========== 密码本 ========== -->
        <section class="cipher-section">
            <div class="cipher-row">
                <span id="cipherStatus">🔒 未加载密码本</span>
                <button id="loadCipherBtn">加载密码本</button>
                <button id="unloadCipherBtn" class="btn-danger">卸载</button>
            </div>
        </section>

        <!-- ========== 文件列表 ========== -->
        <section class="file-section">
            <div class="file-toolbar">
                <span>📋 GJY 文件</span>
                <span id="fileCount" style="color:#999;font-size:12px;">共 0 个文件</span>
                <button id="refreshBtn">🔄 刷新</button>
            </div>
            <ul id="fileList"></ul>
        </section>

        <!-- ========== 预览区域 ========== -->
        <section class="preview-section">
            <div class="preview-header">
                <span id="fileName">未选择文件</span>
                <button id="viewBtn" class="btn-primary">👁️ 查看</button>
            </div>
            <div id="previewContent" class="preview-content">
                <p class="placeholder">请选择一个 GJY 文件，点击「查看」</p>
            </div>
        </section>

        <!-- ========== 页面导航（GJYY 专用） ========== -->
        <div id="pageNav" style="display:none;">
            <button id="prevPageBtn">◀ 上一页</button>
            <span id="pageInfo">第 1 / 1 页</span>
            <button id="nextPageBtn">下一页 ▶</button>
        </div>

        <!-- ========== 图片查看器弹窗 ========== -->
        <div id="imageViewer" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close-btn" id="closeImageViewer">&times;</span>
                <h3 id="viewerTitle">🖼️ 图片查看器</h3>
                <div id="viewerBody">
                    <canvas id="viewerCanvas"></canvas>
                    <div class="viewer-controls">
                        <button id="viewerPrev">◀ 上一张</button>
                        <span id="viewerIndex">1 / 1</span>
                        <button id="viewerNext">下一张 ▶</button>
                        <button id="viewerDownload" class="btn-success">💾 下载</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== 底部 ========== -->
        <footer>
            <div class="footer-warning">
                ⚠️ 本工具由 AI 生成，所有内容仅供参考，请自行甄别真伪。
            </div>
            <div class="footer-repo">
                <a href="https://github.com/mxsyjkm/gjy-file-edit/" target="_blank">
                    GitHub: github.com/mxsyjkm/gjy-file-edit/
                </a>
            </div>
        </footer>

    </div>

    <script src="viewer.js"></script>
</body>
</html>
